<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interest & Date Calculator</title>

<meta name="theme-color" content="#172554">
<meta name="description" content="Monthly Interest and Date Difference Calculator">

<link rel="manifest" href="./manifest.json">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc 50%, #e0f2fe);
    color: #172033;
    min-height: 100vh;
    padding: 20px 12px 40px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

.header {
    background: linear-gradient(135deg, #172554, #1e3a8a);
    color: white;
    padding: 25px 20px;
    border-radius: 20px;
    text-align: center;
    margin-bottom: 18px;
    box-shadow: 0 12px 30px rgba(23,37,84,.20);
}

.header h1 {
    font-size: 27px;
    margin-bottom: 7px;
}

.header p {
    font-size: 14px;
    opacity: .88;
}

.card {
    background: rgba(255,255,255,.96);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 8px 25px rgba(15,23,42,.08);
    border: 1px solid #e5e7eb;
}

.section-title {
    font-size: 19px;
    font-weight: 700;
    color: #172554;
    margin-bottom: 17px;
}

.input-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.date-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
    color: #475569;
}

.input-wrap {
    position: relative;
}

.input-wrap span {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    font-weight: bold;
    color: #64748b;
}

.input-wrap input {
    width: 100%;
    padding: 13px;
    border: 1.5px solid #cbd5e1;
    border-radius: 11px;
    outline: none;
    font-size: 16px;
    background: #f8fafc;
}

.input-wrap input.money {
    padding-left: 35px;
}

.input-wrap input:focus {
    border-color: #2563eb;
    background: white;
    box-shadow: 0 0 0 3px rgba(37,99,235,.10);
}

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

button {
    flex: 1;
    border: none;
    padding: 14px;
    border-radius: 11px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.calculate-btn {
    background: #172554;
    color: white;
}

.reset-btn {
    background: #e2e8f0;
    color: #334155;
}

.summary-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.summary-box {
    padding: 16px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 13px;
}

.summary-box .label {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 5px;
}

.summary-box .value {
    font-size: 19px;
    font-weight: 800;
    color: #172554;
}

.final-box {
    background: linear-gradient(135deg, #172554, #1e40af);
    color: white;
    border: none;
}

.final-box .label,
.final-box .value {
    color: white;
}

.final-box .value {
    font-size: 23px;
}

.table-wrapper {
    overflow-x: auto;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
}

table {
    width: 100%;
    min-width: 850px;
    border-collapse: collapse;
    background: white;
}

th {
    background: #172554;
    color: white;
    padding: 12px 10px;
    font-size: 12px;
    text-align: center;
    white-space: nowrap;
}

td {
    padding: 12px 10px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
    font-size: 13px;
    white-space: nowrap;
}

tr:nth-child(even) {
    background: #f8fafc;
}

.period-number {
    font-weight: 800;
    color: #1e3a8a;
}

.new-principal {
    font-weight: 800;
    color: #166534;
}

.empty-message {
    text-align: center;
    color: #94a3b8;
    padding: 25px 10px;
}

.extra-days-box {
    margin-top: 16px;
    padding: 15px;
